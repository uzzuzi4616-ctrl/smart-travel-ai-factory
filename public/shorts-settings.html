<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚙️ 영상 편집 설정 | SMART AI FACTORY</title><link rel="stylesheet" href="/shorts-suite.css"></head><body><aside><a href="/"><h2>🌐 SMART<br>AI FACTORY</h2></a><div class="group">SHORTS STUDIO</div><a class="nav " href="/video-editor.html">🎬 쇼츠 프로젝트</a><a class="nav " href="/shorts-template.html">🎨 템플릿 설정</a><a class="nav " href="/shorts-automation.html">⏰ 자동 제작 루틴</a><a class="nav " href="/shorts-publish.html">📤 SNS 쇼츠 업로드</a><a class="nav " href="/shorts-calendar.html">🗓️ 업로드 캘린더</a><a class="nav " href="/shorts-longform.html">✂️ 롱폼 편집</a><a class="nav active" href="/shorts-settings.html">⚙️ 편집 설정</a><div class="group">WORKSPACE</div><a class="nav" href="/script-ai">📝 AI 대본 생성</a><a class="nav" href="/music-ai">🎵 AI 음악</a><a class="nav" href="/">🏠 메인 대시보드</a></aside><main><h1>⚙️ 영상 편집 설정</h1><p class="lead">기본 영상 스타일, 자막과 인트로·아웃트로 설정을 저장합니다.</p><section class="panel"><h2>기본 편집 설정</h2><div class="row"><div class="field"><label>편집 템포</label><select id="setPace"><option>보통</option><option>빠르게</option><option>느리게</option></select></div><div class="field"><label>영상 비율</label><select id="setRatio"><option>9:16</option><option>16:9</option><option>1:1</option></select></div><div class="field"><label>기본 자막 언어</label><select id="setLang"><option>한국어</option><option>English</option><option>日本語</option></select></div></div><div class="grid"><div class="card"><h2>자막</h2><label><input type="checkbox" id="setCaptions" checked> 자막 표시</label><label>자막 크기</label><input id="setFontSize" type="number" value="24"></div><div class="card"><h2>하이라이트</h2><label><input type="checkbox" id="setHighlight" checked> 하이라이트 구간 강조</label><label>기본 쇼츠 길이</label><select id="setLength"><option>30</option><option>60</option><option>15</option></select></div><div class="card"><h2>인트로 / 아웃트로</h2><label>인트로 문구</label><input id="setIntro" placeholder="영상 시작 문구"><label>아웃트로 문구</label><input id="setOutro" placeholder="구독과 좋아요"></div></div><button class="primary" id="settingsSave">💾 기본 설정 저장</button><p id="settingsMsg" class="muted"></p></section></main><script src="/shorts-suite.js"></script>
