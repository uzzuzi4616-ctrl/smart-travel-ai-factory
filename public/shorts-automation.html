<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⏰ 자동 제작 루틴 | SMART AI FACTORY</title><link rel="stylesheet" href="/shorts-suite.css"></head><body><aside><a href="/"><h2>🌐 SMART<br>AI FACTORY</h2></a><div class="group">SHORTS STUDIO</div><a class="nav " href="/video-editor.html">🎬 쇼츠 프로젝트</a><a class="nav " href="/shorts-template.html">🎨 템플릿 설정</a><a class="nav active" href="/shorts-automation.html">⏰ 자동 제작 루틴</a><a class="nav " href="/shorts-publish.html">📤 SNS 쇼츠 업로드</a><a class="nav " href="/shorts-calendar.html">🗓️ 업로드 캘린더</a><a class="nav " href="/shorts-longform.html">✂️ 롱폼 편집</a><a class="nav " href="/shorts-settings.html">⚙️ 편집 설정</a><div class="group">WORKSPACE</div><a class="nav" href="/script-ai">📝 AI 대본 생성</a><a class="nav" href="/music-ai">🎵 AI 음악</a><a class="nav" href="/">🏠 메인 대시보드</a></aside><main><h1>⏰ 자동 제작 루틴</h1><p class="lead">채널별 제작 계획과 템플릿을 설정합니다. 자동 실행은 서버 연동이 필요합니다.</p><div class="panel"><h2>채널 및 일정</h2><div class="row"><div class="field"><label>채널 이름</label><input id="autoChannel" placeholder="예: 시니어모먼트TV"></div><div class="field"><label>매일 제작 시간</label><input id="autoTime" type="time" value="09:00"></div><div class="field"><label>시간대</label><select id="autoZone"><option>Asia/Seoul</option><option>UTC</option></select></div></div><label><input id="autoEmail" type="checkbox"> 제작 완료 이메일 알림 (추후 연동)</label></div><div class="panel"><h2>템플릿 선택</h2><div class="grid" id="autoTemplates"></div><h2>제작 방식</h2><div class="row"><div class="field"><label>쇼츠 길이</label><select id="autoLength"><option>30</option><option>60</option><option>15</option></select></div><div class="field"><label>제작 모드</label><select id="autoMode"><option>하이라이트</option><option>수동 구간</option></select></div></div><label>AI 요청 메모</label><textarea id="autoPrompt" placeholder="예: 여행 풍경을 강조해주세요"></textarea><button class="primary" id="autoSave">💾 루틴 설정 저장</button><p id="autoMsg" class="notice">현재는 루틴 설정 저장만 가능합니다. 예약 자동 제작은 작동하지 않습니다.</p></div></main><script src="/shorts-suite.js"></script>
