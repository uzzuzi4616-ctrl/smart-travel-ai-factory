*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f4f5fa;font-family:system-ui,'Malgun Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #363b48;border-radius:10px;background:#20232c;color:#f5f6fc;padding:10px 13px}button:hover{background:#343b4a}button:disabled{opacity:.45;cursor:not-allowed}a{color:#a9d5ff;text-decoration:none}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}nav{border-right:1px solid #30313a;padding:24px 15px;background:#0d0d10}nav h2{font-size:17px;margin:0 0 30px}nav a{display:block;padding:13px;border-radius:9px;margin:5px 0}nav a.active{background:#2d303a;color:white}main{background:#0b0b0e;min-height:100vh;padding:30px 34px 112px;max-width:1400px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:30px}.muted{color:#a6aab9;font-size:13px}.tabs{display:flex;gap:20px;border-bottom:1px solid #323540;margin-top:24px;padding-bottom:13px}.tabs span{font-size:14px;border-bottom:2px solid #fff;padding:0 6px 13px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.tools input{flex:1;min-width:170px;background:#20232c;border:1px solid #353946;color:white;padding:12px;border-radius:10px}.tools select{background:#20232c;color:white;border:1px solid #353946;padding:12px;border-radius:10px}.upload{background:#22242b;color:#ffffff;font-weight:750;border:1px solid #474a56}.list{display:grid;gap:8px}.song{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:15px;padding:12px;border:1px solid transparent;border-radius:13px;background:#141419}.song:hover{background:#22232a}.song.playing{border-color:#8f93ff;background:#222439}.cover{height:56px;width:56px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#38658c,#7a3f87);font-size:25px}.song h3{font-size:15px;margin:0 0 5px;overflow:hidden;text-overflow <div class="layout"><nav><h2>🎬 SMART AI FACTORY</h2><a href="/">🏠 AI 패키지</a><a href="/video-editor">🎞️ AI 영상 편집 TOOL</a><a href="/library" class="active">🎵 음악 라이브러리</a></nav><main><header><div><h1>Music Library</h1><p class="muted">＋ Audio 버튼으로 음악을 추가하면 아래 목록에 자동 등록됩니다. 클릭해서 미리 듣고 영상 편집기에 사용할 수 있습니다.</p></div><button class="upload" id="add">＋ Audio</button><input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple></header><div class="tabs"><span>🎵 Songs</span><small class="muted" id="count">0곡</small></div><div class="tools"><input id="search" placeholder="🔎 제목 또는 파일 이름 검색" aria-label="음악 검색"><select id="sort" aria-label="정렬"><option value="new">최신 등록순</option><option value="name">제목순</option><option value="old">오래된순</option></select><button id="clearSearch">검색 초기화</button></div><p class="notice" id="notice" role="status"></p><div class="list" id="list"><div class="empty">🎶 ＋ Audio 버튼으로 음악을 추가하면 이곳에 나타납니다.</div></div><p class="muted" style="margin-top:22px">※ 음악은 현재 브라우저의 로컬 저장소(IndexedDB)에 보관됩니다. 서버·다른 기기와 동기화되지 않습니다. 사용 권한이 있는 음원만 등록하세요.</p></main></div>
<div class="player"><div class="now" id="now">🎧 선택한 음악 없음</div><button id="prev" aria-label="이전 곡">⏮</button><button id="toggle" aria-label="재생 일시정지">▶</button><button id="next" aria-label="다음 곡">⏭</button><div class="seek"><input type="range" id="progress" min="0" max="1000" value="0" aria-label="재생 위치"><small id="clock">00:00 / 00:00</small></div><label style="font-size:12px;color:#aaa">🔊 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" style="width:80px;accent-color:#8d8cff"></label><audio id="audio" preload="metadata"></audio></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,rows=[],currentId=null,objectUrl=null;const audio=$('audio');audio.volume=.8;const msg=t=>$('notice').textContent=t;const format=n=>{if(!Number.isFinite(n))return '00:00';return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')};const reqP=req=>new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const openDB=()=>new Promise((resolve,reject)=>{const req=indexedDB.open('smart-ai-factory-music',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('tracks'))req.result.createObjectStore('tracks',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const store=(mode='readonly')=>db.transaction('tracks',mode).objectStore('tracks');async function get(id){return reqP(store().get(id))}async function save(row){return reqP(store('readwrite').put(row))}async function remove(id){return reqP(store('readwrite').delete(id))}async function refresh(){rows=await reqP(store().getAll());render()}function visible(){let r=rows.filter(x=>(x.title+' '+x.filename).toLocaleLowerCase().includes($('search').value.trim().toLocaleLowerCase()));const sort=$('sort').value;r.sort((a,b)=>sort==='name'?a.title.localeCompare(b.title):sort==='old'?a.created-b.created:b.created-a.created);return r}function render(){const list=$('list');list.replaceChildren();$('count').textContent=rows.length+'곡';const v=visible();if(!v.length){const el=document.createElement('div');el.className='empty';el.textContent=rows.length?'검색 결과가 없습니다.':'🎶 오른쪽 상단 ＋ Audio 버튼을 눌러 음악을 추가하세요.';list.append(el);return}v.forEach(row=>{const card=document.createElement('article');card.className='song'+(row.id===currentId?' playing':'');const cover=document.createElement('div');cover.className='cover';cover.textContent='♫';const info=document.createElement('div');info.style.minWidth='0';const h=document.createElement('h3');h.textContent=row.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=row.filename+' · '+(row.blob.size/1024/1024).toFixed(1)+' MB';info.append(h,meta);const actions=document.createElement('div');actions.className='actions';const make=(label,cb,cls='')=>{const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=cb;actions.append(b)};make(row.id===currentId&&!audio.paused?'⏸ 일시정지':'▶ 미리 듣기',()=>play(row.id),'play');make('✏ 제목 수정',async()=>{const title=prompt('음악 제목 수정',row.title);if(title===null)return;const value=title.trim().slice(0,150);if(!value)return msg('제목을 입력하세요.');row.title=value;await save(row);refresh()});make('🎬 편집기에 사용',()=>{localStorage.setItem('smart-ai-library-music-id',row.id);location.href='/video-editor?libraryMusic='+encodeURIComponent(row.id)});make('⬇ 저장',()=>{const u=URL.createObjectURL(row.blob);const a=document.createElement('a');a.href=u;a.download=row.filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});make('🗑 삭제',async()=>{if(!confirm('이 음악을 라이브러리에서 삭제할까요?'))return;if(currentId===row.id){audio.pause();audio.removeAttribute('src');currentId=null;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;$('now').textContent='🎧 선택한 음악 없음'}await remove(row.id);await refresh();msg('음악을 삭제했습니다.')});card.append(cover,info,actions);list.append(card)})}async function play(id){if(currentId===id){if(audio.paused)await audio.play();else audio.pause();render();return}const row=await get(id);if(!row)return msg('음악 파일을 찾을 수 없습니다.');audio.pause();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(row.blob);audio.src=objectUrl;currentId=id;$('now').textContent='🎵 '+row.title;try{await audio.play()}catch(e){msg('재생할 수 없는 오디오 형식일 수 있습니다.')}render()}function adjacent(dir){const v=visible();if(!v.length)return;const i=v.findIndex(x=>x.id===currentId);play(v[(i+dir+v.length)%v.length].id)}$('add').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const files=[...e.target.files];let count=0;for(const file of files){if(!file.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|ogg|flac)$/i.test(file.name)){msg(file.name+'은 음악 파일이 아닙니다.');continue}if(file.size>60*1024*1024){msg(file.name+'은 60MB를 초과합니다.');continue}try{await save({id:crypto.randomUUID(),title:file.name.replace(/\.[^.]+$/,''),filename:file.name,created:Date.now()+count,blob:file});count++}catch(err){msg('저장 공간이 부족하거나 저장이 거부되었습니다: '+err.message);break}}e.target.value='';await refresh();if(count){msg(count+'곡을 라이브러리에 추가했습니다. 아래 목록에서 ▶ 미리 듣기를 누르세요.');document.getElementById('list').scrollIntoView({behavior:'smooth',block:'nearest'});}};$('search').oninput=render;$('sort').onchange=render;$('clearSearch').onclick=()=>{$('search').value='';render()};$('toggle').onclick=()=>{if(currentId===null)adjacent(1);else{audio.paused?audio.play():audio.pause();render()}};$('prev').onclick=()=>adjacent(-1);$('next').onclick=()=>adjacent(1);$('volume').oninput=e=>audio.volume=Number(e.target.value);$('progress').oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(e.target.value)/1000*audio.duration};audio.ontimeupdate=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)$('progress').value=Math.round(audio.currentTime/audio.duration*1000);$('clock').textContent=format(audio.currentTime)+' / '+format(audio.duration)};audio.onended=()=>adjacent(1);audio.onplay=audio.onpause=render;openDB().then(x=>{db=x;refresh()}).catch(e=>msg('브라우저 음악 저장소를 열 수 없습니다: '+e.message));})();
</script><script src="/language-pack.js?v=38" defer></script>
